<!doctype html><html lang="en"><meta charset="utf-8"><title>Account settings</title>
<style>body{font:18px sans-serif;margin:35px}label{display:block;margin:16px}button{padding:12px}dialog{padding:30px}section{margin-top:35px}</style>
<main aria-label="Settings"><h1>Account settings</h1>
<form onsubmit="return false"><label for="city">City</label><input id="city" value="London"><label for="alias">Display name</label><input id="alias" value="Alex"><button id="review" type="button">Review changes</button></form>
<section role="region" aria-label="Saved account"><label>Saved city<input name="city" readonly value="London"></label><label>Saved display name<input name="alias" readonly value="Alex"></label></section>
<dialog aria-label="Confirm changes"><h2>Confirm changes</h2><p id="summary"></p><button id="confirm">Confirm save</button><button id="cancel">Cancel</button></dialog>
</main><script>
const city=document.querySelector('#city'),alias=document.querySelector('#alias'),dialog=document.querySelector('dialog');
document.querySelector('#review').onclick=()=>{document.querySelector('#summary').textContent='Save city '+city.value+' and display name '+alias.value+'?';dialog.showModal()};
document.querySelector('#cancel').onclick=()=>dialog.close();
document.querySelector('#confirm').onclick=async()=>{const r=await fetch('save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({city:city.value,alias:alias.value})});if(r.ok){document.querySelector('[name=city]').value=city.value;document.querySelector('[name=alias]').value=alias.value;dialog.close()}};
</script></html>
